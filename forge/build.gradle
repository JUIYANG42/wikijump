plugins {
    id 'wikijump-loader'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true

    // Forge 1.20.6+ uses official mappings at runtime, no reobf needed.
    reobf = false

    // ForgeGradle userdev applies ATs with SRG names (hoveredSlot = f_97734_),
    // so Forge needs its own AT file rather than the Mojmap-name one in common.
    def at = file('src/main/resources/META-INF/wikijump-forge-srg.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}
