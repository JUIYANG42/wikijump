name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, e.g. v1.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: ref
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
          # The release body is the tag annotation, so the tag object has to be
          # in the clone — the default shallow, tag-less checkout would miss it.
          fetch-depth: 0
          fetch-tags: true

      - name: Read the release notes from the tag annotation
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          git tag -l --format='%(contents)' "$TAG" > release-notes.md
          if [ -s release-notes.md ]; then
            echo "Using the annotation on $TAG as the release body:"
            cat release-notes.md
          else
            echo "$TAG has no annotation; falling back to generated notes"
            rm -f release-notes.md
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the 1.21.1 loaders
        run: ./gradlew build

      # MC 26.1 cannot share that build: it needs Gradle 9 and Java 25, whereas
      # ForgeGradle pins the root build to Gradle 8 / Java 21. It therefore runs
      # as a second, nested build — see modern/build.gradle for the rationale.
      #
      # Both generations ship from this one job on purpose: whoever creates the
      # GitHub release must be a single writer, or two jobs would race for it.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build the 26.1 loaders
        working-directory: modern
        # Same tee + single retry + failure-report trio as in build.yml: this is
        # the one step whose dependencies are network-only (mirrored Gradle
        # distribution, Aliyun plugin lookups), and a tag push should not fail
        # for a reason a second attempt fixes.
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            if ./gradlew :fabric:build :neoforge:build --console=plain 2>&1 \
                 | tee "$RUNNER_TEMP/modern-build.log"; then
              exit 0
            fi
            echo "::warning::modern build attempt $attempt failed"
            rm -rf "$HOME/.gradle/wrapper/dists/gradle-9.7.1-bin"
          done
          exit 1

      - name: Report the modern build failure
        if: failure()
        shell: bash
        run: |
          {
            echo '### Modern (26.1) build failed'
            echo
            echo '```'
            tail -n 250 "$RUNNER_TEMP/modern-build.log" 2>/dev/null || echo '(no log captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect release jars
        run: |
          mkdir -p dist
          # The archive name carries the Minecraft version, so the 1.21.1 and
          # 26.1.2 jars of one loader never collide in dist/.
          find fabric/build/libs neoforge/build/libs forge/build/libs \
            modern/fabric/build/libs modern/neoforge/build/libs \
            -maxdepth 1 -name 'wikijump-*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' \
            -exec cp {} dist/ \;
          ls -lh dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          title="WikiJump ${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.jar --clobber
            # Re-pushing a tag rebuilds and republishes; refresh the body too,
            # so a corrected tag annotation is not left stale on the page.
            if [ -s release-notes.md ]; then
              gh release edit "$TAG" --title "$title" --notes-file release-notes.md
            fi
          elif [ -s release-notes.md ]; then
            # The tag annotation is written by hand, so it already describes
            # what changed; do not bury it under a generated changelog.
            gh release create "$TAG" dist/*.jar \
              --title "$title" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" dist/*.jar \
              --title "$title" \
              --generate-notes
          fi
