name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all loaders
        run: ./gradlew build

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: wikijump-fabric
          path: fabric/build/libs/*.jar

      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: wikijump-neoforge
          path: neoforge/build/libs/*.jar

      - name: Upload Forge jar
        uses: actions/upload-artifact@v4
        with:
          name: wikijump-forge
          path: forge/build/libs/*.jar

  # MC 26.1 lives in a nested Gradle build (see modern/build.gradle): it needs
  # Gradle 9 + Java 25, and there is no Forge for that line at all. A separate
  # job so it runs in parallel with the 1.21.1 build above.
  build-modern:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the 26.1 loaders
        working-directory: modern
        run: ./gradlew :fabric:build :neoforge:build

      - name: Upload Fabric jar (26.1)
        uses: actions/upload-artifact@v4
        with:
          name: wikijump-fabric-26.1
          path: modern/fabric/build/libs/*.jar

      - name: Upload NeoForge jar (26.1)
        uses: actions/upload-artifact@v4
        with:
          name: wikijump-neoforge-26.1
          path: modern/neoforge/build/libs/*.jar
