plugins {
    id 'wikijump-loader'
    id 'fabric-loom'
}

repositories {
    // Mod Menu. Optional integration, so it lives here rather than in the shared
    // convention plugin: only the Fabric projects need this repository.
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // compileOnly, never bundled or exposed: the integration class implements
    // ModMenuApi, so Fabric only loads it if Mod Menu asks for the "modmenu"
    // entrypoint. Without Mod Menu installed nothing references it and the mod
    // runs unchanged.
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
    }
}
