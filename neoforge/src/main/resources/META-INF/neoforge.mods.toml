modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${description}'''
# Access transformer shipped inside the jar (Mojmap names, applied at runtime).
[[accessTransformers]]
file = "META-INF/wikijump-common.cfg"
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
# Lower bound of the supported NeoForge range, not the compile version: the
# loader refuses to start a mod whose range excludes the running NeoForge.
versionRange = "[${neoforge_min_version},)"
ordering = "NONE"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
