// Shared configuration for all WikiJump subprojects (common + the three loaders).
plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = 'NeoForge'
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
}

// Declare capabilities on the outgoing configurations so a loader project that
// depends on :common can consume its sources without Gradle also linking the
// common jar itself into the final mod jar.
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

jar {
    // The suffix is resolved at configuration time rather than read inside the
    // rename closure: that closure runs while the jar is written, and under the
    // configuration cache it is restored without its script, so a bare
    // `mod_name` in there would fail with MissingPropertyException. This build
    // does not enable the cache (ForgeGradle writes into it during
    // configuration), but the sibling modern/ build does, and the same
    // construct must not be a trap there.
    def licenseSuffix = "_${mod_name}"
    from(rootProject.file('LICENSE')) {
        rename { String fileName -> fileName + licenseSuffix }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                       : version,
            'group'                         : project.group,
            'minecraft_version'             : minecraft_version,
            'minecraft_version_range'       : minecraft_version_range,
            'fabric_version'                : fabric_version,
            'fabric_loader_version'         : fabric_loader_version,
            'mod_name'                      : mod_name,
            'mod_author'                    : mod_author,
            'mod_id'                        : mod_id,
            'license'                       : license,
            'description'                   : project.description,
            'neoforge_version'              : neoforge_version,
            'neoforge_min_version'          : neoforge_min_version,
            'neoforge_loader_version_range' : neoforge_loader_version_range,
            'forge_version'                 : forge_version,
            'forge_loader_version_range'    : forge_loader_version_range,
            'credits'                       : credits,
            'java_version'                  : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
