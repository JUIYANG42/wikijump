# WikiJump build versions
# Minecraft 1.21.1 / Java 21

# Project
version=1.4.0
group=com.wikijump
java_version=21

# Common
minecraft_version=1.21.1
mod_name=WikiJump
mod_author=WikiJump Team
mod_id=wikijump
license=MIT
credits=
description=Press a key to open the Minecraft Wiki page of the block, entity or item you are looking at.
minecraft_version_range=[1.21.1,1.22)
neo_form_version=1.21.1-20240808.144430

# Fabric (https://fabricmc.net/develop/)
fabric_version=0.116.17+1.21.1
fabric_loader_version=0.16.9

# Forge (https://files.minecraftforge.net/)
forge_version=52.1.0
forge_loader_version_range=[52,)

# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
# Pinned to .249 on purpose: see neoforge/build.gradle for why the compile
# version and the declared range must move together.
neoforge_version=21.1.249
# Lower bound of the "neoforge" dependency written into neoforge.mods.toml.
# Must stay <= neoforge_version, or the loader refuses the mod on the very
# NeoForge build it was compiled against.
# 21.1.x shares one Minecraft (1.21.1), and .249/.250 differ only in a sound
# data class we do not touch, so the whole 21.1 line stays compatible.
neoforge_min_version=21.1.249
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
