# WikiJump build versions — Minecraft 26.1 generation
#
# This is a SECOND, independent Gradle build that lives beside the root one.
# The split exists because the two generations need incompatible Gradle lines:
#
#   root   Gradle 8.14.5 -> MC 1.21.1  (ForgeGradle 6 only supports Gradle 8)
#   modern Gradle 9.7.1  -> MC 26.1.2  (Loom 1.17 requires Gradle 9)
#
# One wrapper cannot serve both, so `modern/` carries its own settings.gradle,
# wrapper and buildSrc. Run it with `modern/gradlew`, not the root one.
# See modern/build.gradle for the full rationale.
#
# Project identity (version, group, mod_id, mod_name, mod_author, license,
# credits, description) is deliberately NOT defined here — the buildSrc
# convention plugin (wikijump-common.gradle) reads it from the root
# gradle.properties, so a release bumps one number instead of two and those
# values cannot drift between generations.
# This file holds only what genuinely differs between the two.

# Project
# java_version differs: 26.x requires Java 25; the root build stays on 21.
java_version=25

# Common
minecraft_version=26.1.2
# 26.1.x patch releases share one API surface for our purposes; 26.2 is a
# separate generation and is deliberately out of scope for now.
minecraft_version_range=[26.1,26.2)
# Modern NeoForm versioning is "<mc version>-<neoform build>", not a timestamp.
neo_form_version=26.1.2-1

# Fabric (https://fabricmc.net/develop/)
fabric_version=0.155.3+26.1.2
fabric_loader_version=0.19.5
# Mod Menu (https://modrinth.com/mod/modmenu) — optional integration, compile
# only. Mod Menu's own version numbers are independent of Minecraft's: the 18.x
# line is the 26.1 one (the root build's 1.21.1 uses 11.x).
modmenu_version=18.0.1

# Forge (https://files.minecraftforge.net/)
# There is no Forge for the 26.x generation — the project stops at 21.1.x.
# That is the whole reason this build only contains fabric/neoforge, and why the
# root build keeps Forge on 1.21.1.
# forge_version / forge_loader_version_range are intentionally absent.

# NeoForge (https://projects.neoforged.net/neoforged/neoforge)
# Four segments on the 26.x line: <mc major>.<mc minor>.<mc patch>.<build>.
neoforge_version=26.1.2.109
# Lower bound of the "neoforge" dependency written into neoforge.mods.toml.
# Must stay <= neoforge_version or the loader refuses the mod.
neoforge_min_version=26.1.2.109
neoforge_loader_version_range=[4,)

# Gradle
# 4G rather than the root's 3G: NeoForm for 26.x is a heavier decompile.
org.gradle.jvmargs=-Xmx4G
# Daemon on, same as the root build: without it every compile pays a fresh JVM
# start-up on top of the work itself.
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Safe here, unlike in the root build: Loom 1.17 and ModDevGradle 2.x both keep
# their configuration-time work within the configuration cache's rules, while
# ForgeGradle 6 (root build only) does not.
org.gradle.configuration-cache=true
