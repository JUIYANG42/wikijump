// Configuration for the 26.x generation loader subprojects.
//
// Four layers get merged, weakest first:
//
//   1. ../common/src/main/java        generation-independent core
//   2. ../<loader>/src/main/java      that loader's adapter, shared with the
//                                     root build so it is written once
//   3. ../overlay/{java,resources}    this generation's replacements
//   4. src/main/{java,resources}      this project's replacements
//
// Layers 1-3 come from outside the nested build; layer 4 is the escape hatch
// for something only one loader needs. A file present in a later layer wins,
// and the earlier copy is filtered out so javac never sees the class twice.
//
// Why layers 3/4 exist at all: 26.1 replaced the render entry points
// (GuiGraphics -> GuiGraphicsExtractor, Screen#render -> extractRenderState),
// renamed ResourceLocation to Identifier, changed several Fabric API names, and
// bumped the resource pack format. A handful of files therefore cannot be one
// file for both generations.
//
// Implementation note: the layers are merged into build/shared/ by Sync tasks,
// and the merged directory is the source set. Two plain `srcDir`s would not do
// — Gradle cannot filter one source root while leaving another unfiltered — and
// `srcDir(fileTree(...))` is outright unusable here: Gradle treats each file of
// the FileTree as its own source directory and fails with "Source directory
// '.../en_us.json' is not a directory".

plugins {
    id 'wikijump-common'
}

/** Layer 1: the generation-independent sources, one level up from this build. */
def sharedJavaDir = rootProject.file('../common/src/main/java')
def sharedResourcesDir = rootProject.file('../common/src/main/resources')

/** Layer 2: this loader's adapter, outside the common tree. */
def loaderJavaDir = rootProject.file("../${project.name}/src/main/java")
def loaderResourcesDir = rootProject.file("../${project.name}/src/main/resources")

/** Layer 3: replacements shared by both loaders of this generation. */
def generationOverlayJava = rootProject.file('overlay/java')
def generationOverlayResources = rootProject.file('overlay/resources')

/** Layer 4: replacements for this project only. */
def projectOverlayJava = file('src/main/java')
def projectOverlayResources = file('src/main/resources')

def mergedJavaDir = layout.buildDirectory.dir('shared/java')
def mergedResourcesDir = layout.buildDirectory.dir('shared/resources')

/** Directories are never shadowed, only exact files. */
def shadowedBy = { Object element, List<File> roots ->
    !element.isDirectory() && roots.any { root ->
        root != null && new File(root, element.path).exists()
    }
}

def registerMerge = { String taskName, String description, Object destination, List<Map> layers ->
    tasks.register(taskName, Sync) { task ->
        task.description = description
        task.into(destination)
        layers.each { layer ->
            File dir = layer.dir
            List<File> shadows = (layer.shadows ?: []) as List<File>
            if (dir != null && dir.exists()) {
                task.from(dir) { spec ->
                    spec.exclude { element -> shadowedBy(element, shadows) }
                }
            }
        }
    }
}

def javaLayers = [
        [dir: sharedJavaDir,         shadows: [generationOverlayJava, projectOverlayJava]],
        [dir: loaderJavaDir,         shadows: [generationOverlayJava, projectOverlayJava]],
        [dir: generationOverlayJava, shadows: [projectOverlayJava]],
        [dir: projectOverlayJava,    shadows: []],
]

def resourceLayers = [
        [dir: sharedResourcesDir,         shadows: [generationOverlayResources, projectOverlayResources]],
        [dir: loaderResourcesDir,         shadows: [generationOverlayResources, projectOverlayResources]],
        [dir: generationOverlayResources, shadows: [projectOverlayResources]],
        [dir: projectOverlayResources,    shadows: []],
]

def prepareSharedJava = registerMerge('prepareSharedJava',
        'Merges the shared sources with this generation\'s overrides.',
        mergedJavaDir, javaLayers)

def prepareSharedResources = registerMerge('prepareSharedResources',
        'Merges the shared resources with this generation\'s overrides.',
        mergedResourcesDir, resourceLayers)

sourceSets {
    main {
        // The merged trees are the only source roots; the overlays are inputs to
        // the merge, not source sets of their own.
        java.srcDirs = [mergedJavaDir.get().asFile]
        resources.srcDirs = [mergedResourcesDir.get().asFile]
    }
}

tasks.named('compileJava') {
    dependsOn(prepareSharedJava)
}

tasks.named('processResources') {
    dependsOn(prepareSharedResources)
}

tasks.named('sourcesJar') {
    dependsOn(prepareSharedJava, prepareSharedResources)
}
