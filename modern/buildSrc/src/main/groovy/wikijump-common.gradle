// Shared configuration for the 26.x generation subprojects.
//
// Mirrors the root build's wikijump-common.gradle with the generation-B
// differences applied:
//   * no Forge properties (Forge has no 26.x release)
//   * the ParchmentMC repository is gone — 26.1 dropped Parchment support
//   * LICENSE is one level up, because this is a nested build

plugins {
    id 'java-library'
    id 'maven-publish'
}

// ---------------------------------------------------------------------------
// Shared project identity, read from the ROOT build's gradle.properties
// ---------------------------------------------------------------------------
// version / group / mod_id / mod_name / ... are owned by `../gradle.properties`
// so a release bumps one number instead of two and the mod id, name and author
// cannot drift between the two generations. Everything generation-specific
// (minecraft_version, loader versions, java_version) keeps coming from this
// build's own gradle.properties — that one Gradle loads automatically.
//
// Gradle only auto-loads the gradle.properties sitting next to the build root,
// and this is a nested build, so the root file has to be read by hand. Doing it
// here, in the convention plugin every subproject applies, means each project
// gets the values directly rather than relying on inheritance from the root
// project of this build.
def rootGradlePropertiesFile = rootProject.file('../gradle.properties')
def rootGradleProperties = new Properties()
if (rootGradlePropertiesFile.exists()) {
    rootGradlePropertiesFile.withInputStream { rootGradleProperties.load(it) }
}

def sharedProperty = { String key ->
    def value = rootGradleProperties.getProperty(key)
    if (value == null) {
        throw new GradleException(
                "Missing '${key}' in ${rootGradlePropertiesFile}. The 26.1 build reads its "
                        + "project identity from the root build's gradle.properties; add it there.")
    }
    return value
}

// Assigned directly rather than as extra properties: `version`, `group` and
// `description` are real Project properties, so `ext.version = ...` would leave
// project.version at "unspecified" and the mod jar would be misnamed.
project.version = sharedProperty('version')
project.group = sharedProperty('group')
project.description = sharedProperty('description')

ext.mod_id = sharedProperty('mod_id')
ext.mod_name = sharedProperty('mod_name')
ext.mod_author = sharedProperty('mod_author')
ext.license = sharedProperty('license')
ext.credits = sharedProperty('credits')

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    // Aliyun's Central mirror first: upstream Maven Central is slow from this
    // network, and anything the mirror lacks falls through to the real one.
    maven {
        name = 'AliyunCentral'
        url = 'https://maven.aliyun.com/repository/central'
    }
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'NeoForge'
                url = 'https://maven.neoforged.net/releases'
            }
        }
        filter { includeGroup('org.parchmentmc.data') }
    }
}

// Declare capabilities on the outgoing configurations so a loader project that
// depends on :common can consume its sources without Gradle also linking the
// common jar itself into the final mod jar.
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

jar {
    // LICENSE lives at the repo root, one level above the nested modern build.
    def licenseFile = rootProject.file('../LICENSE')
    if (licenseFile.exists()) {
        // The suffix is resolved here, while the build is still being
        // configured, instead of being read inside the rename closure. That
        // closure runs while the jar is written, and with the configuration
        // cache on it is restored without its script — a bare `mod_name` there
        // throws MissingPropertyException ("BrokenScript"), which only shows up
        // once the jar task actually re-executes.
        def licenseSuffix = "_${mod_name}"
        from(licenseFile) {
            rename { String fileName -> fileName + licenseSuffix }
        }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    // forge_* entries are absent on purpose: this build has no Forge project,
    // and reading an undefined property would fail configuration.
    var expandProps = [
            'version'                       : version,
            'group'                         : project.group,
            'minecraft_version'             : minecraft_version,
            'minecraft_version_range'       : minecraft_version_range,
            'fabric_minecraft_dep'          : fabric_minecraft_dep,
            'fabric_version'                : fabric_version,
            'fabric_loader_version'         : fabric_loader_version,
            'mod_name'                      : mod_name,
            'mod_author'                    : mod_author,
            'mod_id'                        : mod_id,
            'license'                       : license,
            'description'                   : project.description,
            'neoforge_version'              : neoforge_version,
            'neoforge_min_version'          : neoforge_min_version,
            'neoforge_loader_version_range' : neoforge_loader_version_range,
            'credits'                       : credits,
            'java_version'                  : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}
